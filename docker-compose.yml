services:
  molfar-vertep:
    # the published image; `docker compose up -d --build` builds this checkout instead
    image: ghcr.io/molfarwav/molfar-vertep:latest
    build: .
    container_name: molfar-vertep
    restart: unless-stopped
    ports:
      - "8788:8788"
    volumes:
      - ./molfar-vertep-data:/molfar-vertep
    # The first start prints a setup link: `docker compose logs molfar-vertep`.
    # Opening Molfar Vertep by a name rather than an IP address (a reverse proxy,
    # a local DNS name) needs that name listed:
    # environment:
    #   MOLFAR_VERTEP_ALLOWED_HOSTS: molfar-vertep.home
