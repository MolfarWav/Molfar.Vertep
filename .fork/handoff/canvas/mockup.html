<title>Canvas для Ролплею</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell (rail · palette · canvas · details), canvas = pan/zoom world with SVG wires under HTML cards. Roleplay tokens. */
:root{
  --bg:#fafafa;--card:#ffffff;--fg:#161616;--muted:#f1f1f2;--mfg:#6b6b6b;--line:rgb(0 0 0 / 11%);--line2:rgb(0 0 0 / 18%);
  --primary:#2eaf5a;--on-primary:#ffffff;--danger:#d92d20;--warn:#b5650d;--warn-soft:rgb(181 101 13 / 10%);
  --dot:rgb(0 0 0 / 9%);--wire:#9a9aa0;--shadow:0 1px 2px rgb(0 0 0 / 6%),0 4px 14px rgb(0 0 0 / 6%);
  --k-who:#d9822b;--k-world:#1f9e8f;--k-story:#7c5cd6;--k-rules:#3b82c4;--k-send:#2eaf5a;--k-chat:#3b82c4;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414;--card:#1b1b1b;--fg:#e6e6e6;--muted:#222222;--mfg:#9d9d9d;--line:#2b2b2b;--line2:#3a3a3a;
  --primary:#54d17d;--on-primary:#0b1a10;--danger:#e5484d;--warn:#e9a24a;--warn-soft:rgb(233 162 74 / 12%);
  --dot:rgb(255 255 255 / 7%);--wire:#6d6d73;--shadow:0 1px 2px rgb(0 0 0 / 40%),0 6px 18px rgb(0 0 0 / 30%);
  --k-who:#f0a35a;--k-world:#3cc4b2;--k-story:#a68bf0;--k-rules:#6aaeea;--k-send:#54d17d;--k-chat:#6aaeea;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414;--card:#1b1b1b;--fg:#e6e6e6;--muted:#222222;--mfg:#9d9d9d;--line:#2b2b2b;--line2:#3a3a3a;
  --primary:#54d17d;--on-primary:#0b1a10;--danger:#e5484d;--warn:#e9a24a;--warn-soft:rgb(233 162 74 / 12%);
  --dot:rgb(255 255 255 / 7%);--wire:#6d6d73;--shadow:0 1px 2px rgb(0 0 0 / 40%),0 6px 18px rgb(0 0 0 / 30%);
  --k-who:#f0a35a;--k-world:#3cc4b2;--k-story:#a68bf0;--k-rules:#6aaeea;--k-send:#54d17d;--k-chat:#6aaeea;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.app{display:grid;grid-template-columns:52px auto 1fr auto;grid-template-rows:auto 1fr;height:100%}
.rail{grid-row:1/3;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px;background:var(--card)}
.rail button{width:38px;height:38px;border:0;background:none;border-radius:var(--r);display:grid;place-items:center;color:var(--mfg);cursor:pointer;position:relative}
.rail button:hover{background:var(--muted);color:var(--fg)}
.rail button.on{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.rail .lbl{position:absolute;left:44px;white-space:nowrap;background:var(--fg);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s}
.rail button:hover .lbl{opacity:1}

.top{grid-column:2/5;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);min-width:0;flex-wrap:wrap}
.title{font-weight:700;font-size:15px;margin-right:4px}
.seg{display:inline-flex;background:var(--muted);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--mfg);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.ib{border:1px solid transparent;background:none;width:34px;height:34px;border-radius:var(--r);display:inline-grid;place-items:center;cursor:pointer;color:var(--fg)}
.ib:hover:not(:disabled){background:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--muted);border-color:var(--line)}
.sep{width:1px;height:22px;background:var(--line)}
.grow{flex:1}
.zoom{display:inline-flex;align-items:center;gap:2px}
.zoom output{font-size:12px;width:44px;text-align:center;color:var(--mfg);font-variant-numeric:tabular-nums}
.saved{font-size:12px;color:var(--mfg);display:inline-flex;align-items:center;gap:6px;min-width:84px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.saved.busy i{background:var(--warn)}
.btn{border:1px solid var(--line2);background:var(--card);padding:6px 12px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-height:32px}
.btn:hover{background:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.ghost{border-color:transparent;background:none}


/* board switch: the first thing to notice */
.seg.boards{background:color-mix(in srgb,var(--primary) 12%,var(--muted));border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);padding:4px}
.seg.boards button{font-size:14px;font-weight:600;padding:6px 14px;min-height:34px;color:var(--fg)}
.seg.boards button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.btn.tidy{background:color-mix(in srgb,var(--k-story) 16%,transparent);border-color:color-mix(in srgb,var(--k-story) 45%,transparent);color:var(--k-story)}
.btn.tidy:hover:not(:disabled){background:color-mix(in srgb,var(--k-story) 26%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
.boards-lbl{font-size:11.5px;color:var(--mfg);font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* side panels */
.side{background:var(--card);border-right:1px solid var(--line);width:268px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .18s}
.side.right{border-right:0;border-left:1px solid var(--line);width:300px}
.side.closed{width:0;border:0}
.side-in{width:268px;display:flex;flex-direction:column;min-height:0;height:100%}
.side.right .side-in{width:300px}
.side h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mfg);margin:0;font-weight:600}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
.side-body{padding:0 12px 16px;overflow:auto;min-height:0;display:grid;gap:10px;align-content:start}
.search{width:100%;border:1px solid var(--line2);background:var(--bg);border-radius:var(--r);padding:8px 10px;font:inherit;color:var(--fg)}
.pal-group{display:grid;gap:6px}
.pal-group h4{margin:6px 0 0;font-size:12px;color:var(--mfg);font-weight:600}
.pal{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:grab;user-select:none;text-align:left;width:100%}
.pal:hover{border-color:var(--line2);background:var(--muted)}
.pal .sw{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.pal b{display:block;font-size:13px;font-weight:600}
.pal small{display:block;color:var(--mfg);font-size:12px;line-height:1.35}
.pal.used{opacity:.5;cursor:default}
.empty-note{font-size:12.5px;color:var(--mfg);border:1px dashed var(--line2);border-radius:var(--r);padding:10px}

/* canvas */
.stage{position:relative;overflow:hidden;min-width:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;touch-action:none;user-select:none}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:2.2;pointer-events:none}
.wire.off{stroke-dasharray:5 5;opacity:.6}
.wire.sel{stroke:var(--primary);stroke-width:3}
.wire.hot{stroke:var(--primary);stroke-width:4;opacity:.9}
.wire-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.wire.live{stroke:var(--primary);stroke-dasharray:6 5}
.wire.live.bad{stroke:var(--danger)}
.wdel{position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--danger);box-shadow:var(--shadow);transform:translate(-50%,-50%)}

.node{position:absolute;width:236px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);user-select:none}
.node::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:10px 10px 0 0;background:var(--kc)}
.node.sel{outline:2px solid var(--primary);outline-offset:2px}
.node.off .nbody,.node.off .nhead .nt{opacity:.5}
.node.drop-ok{outline:2px dashed var(--primary);outline-offset:3px}
.nhead{display:flex;align-items:center;gap:8px;padding:12px 8px 6px 12px;cursor:grab}
.view .nhead{cursor:pointer}
.nicon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--kc);flex:none}
.nicon svg.i{width:15px;height:15px}
.nt{flex:1;min-width:0}
.nt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt small{display:block;font-size:11.5px;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmore{width:28px;height:28px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--mfg);cursor:pointer}
.nmore:hover{background:var(--muted);color:var(--fg)}
.nbody{padding:0 12px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;color:var(--mfg)}
.chip{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--muted);color:var(--mfg);font-variant-numeric:tabular-nums}
.offword{font-size:11.5px;font-weight:600;color:var(--warn)}

.tg{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line2);border:0;cursor:pointer;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s;box-shadow:0 1px 2px rgb(0 0 0 / 30%)}
.tg[aria-checked="true"]{background:var(--primary)}
.tg[aria-checked="true"]::after{left:16px}
.tg:disabled{opacity:.5;cursor:default}

.port{position:absolute;width:30px;height:30px;display:grid;place-items:center;cursor:crosshair;z-index:2}
.port i{width:14px;height:14px;border:2px solid var(--kc);background:var(--card);transition:transform .1s,box-shadow .1s}
.port.in{left:-15px}.port.out{right:-15px}
.port.in i{border-radius:50%}
.port.out i{border-radius:3px;background:var(--kc)}
.port.glow i{transform:scale(1.45);box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 30%,transparent);border-color:var(--primary)}
.port.dim{opacity:.25}
.view .port{cursor:default}

/* output card */
.node.out{width:260px}
.orows{display:grid;padding:2px 0 8px}
.orow{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 16px;font-size:12.5px}
.orow .n{width:20px;height:20px;border-radius:6px;background:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mfg)}
.orow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow.off .t{color:var(--mfg);text-decoration:line-through}
.orow .tok{font-size:11px;color:var(--mfg);font-variant-numeric:tabular-nums}
.orow .port{left:-15px;top:50%;transform:translateY(-50%)}
.orow.add .t{color:var(--mfg);font-style:italic}
.ototal{border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;font-size:12px;color:var(--mfg)}
.ototal b{color:var(--fg);font-variant-numeric:tabular-nums}

/* overlays on stage */
.hud{position:absolute;display:flex;gap:6px;z-index:5}
.hud.br{right:12px;bottom:12px;align-items:flex-end}
.minimap{width:176px;height:112px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.minimap canvas{width:100%;height:100%;display:block}
.panel-tab{position:absolute;top:12px;z-index:5}
.panel-tab.l{left:12px}.panel-tab.r{right:12px}
.reason{position:fixed;z-index:50;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none;max-width:260px;box-shadow:var(--shadow)}
.reason.bad{background:var(--danger);color:#fff}
.coach{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.problems{position:absolute;left:12px;bottom:12px;z-index:5;display:grid;gap:6px;max-width:min(520px,calc(100% - 270px))}
.prob{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--fg);border-radius:var(--r);padding:7px 8px 7px 10px;font-size:12.5px;backdrop-filter:blur(4px)}
.prob svg{color:var(--warn)}
.prob span{flex:1;min-width:0}
.prob .btn{min-height:28px;padding:3px 10px;font-size:12px}

.menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / 25%);padding:6px;min-width:220px;max-width:280px;display:grid;gap:2px}
.menu .mh{font-size:11.5px;color:var(--mfg);padding:4px 8px 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.menu button{border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--muted)}
.menu button.d{color:var(--danger)}
.menu button small{color:var(--mfg);display:block;font-size:11.5px}
.menu .none{font-size:12.5px;color:var(--mfg);padding:6px 8px}
.menu input{margin:2px 2px 4px;width:calc(100% - 4px)}

/* details */
.d-sec{display:grid;gap:8px;padding-block:4px}
.d-title{display:flex;gap:10px;align-items:center}
.d-title b{font-size:16px}
.d-desc{color:var(--mfg);font-size:13px;margin:0}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:500}
.field .hint{font-size:12px;color:var(--mfg)}
.field select,.field input[type=text]{border:1px solid var(--line2);background:var(--bg);color:var(--fg);border-radius:var(--r);padding:7px 9px;font:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.callout{border:1px solid var(--line);background:var(--muted);border-radius:var(--r);padding:9px 11px;font-size:12.5px;color:var(--mfg)}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--mfg);font-size:13px}
.linkbtn{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px;justify-self:start}
.infobtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--mfg)}
.infobtn svg.i{width:14px;height:14px}
.pop{position:fixed;z-index:70;width:280px;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / 25%);padding:12px 14px;font-size:13px}
.pop p{margin:0 0 8px}.pop p:last-child{margin:0}
.kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg)}

/* sheets, toast, tour */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / 35%);z-index:80;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header b{font-size:15px}
.sheet .sb{padding:14px 16px;overflow:auto;display:grid;gap:10px;align-content:start;min-height:0}
.prev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prev .ph{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--muted);font-size:12.5px;font-weight:600}
.prev .ph span{color:var(--mfg);font-weight:500;font-variant-numeric:tabular-nums}
.prev pre{margin:0;padding:8px 10px;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;color:var(--mfg);max-height:90px;overflow:hidden}
.prev.offp{opacity:.55}
pre.json{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;white-space:pre-wrap;word-break:break-all;margin:0;max-height:60vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:var(--shadow)}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600}
.tour{position:fixed;z-index:85;width:300px;background:var(--card);border:1px solid var(--primary);border-radius:12px;box-shadow:0 14px 40px rgb(0 0 0 / 30%);padding:14px 16px;display:grid;gap:8px}
.tour .step{font-size:11.5px;color:var(--primary);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tour b{font-size:15px}
.tour p{margin:0;color:var(--mfg);font-size:13px}
.tour .row{margin-top:4px}
.confirm-inline{display:grid;gap:8px}

/* phone */
.phone-note{display:none}
.list{display:none}
@media (max-width:767px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .rail{grid-row:4;grid-column:1;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
  .rail .lbl{display:none}
  .top{grid-column:1;padding:8px 12px;gap:6px}
  .top .desk{display:none}
  .side{display:none}
  .phone-note{display:flex;grid-column:1;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--muted);border-bottom:1px solid var(--line);font-size:13px;color:var(--mfg)}
  .phone-note svg{color:var(--fg);margin-top:1px}
  .stage{grid-column:1}
  .app.listmode .stage{display:none}
  .app.listmode .list{display:grid}
  .list{grid-column:1;overflow:auto;padding:12px 12px 24px;align-content:start;gap:8px}
  .problems{max-width:calc(100% - 24px);bottom:12px}
  .minimap{display:none}
  .ib{width:40px;height:40px}
  .seg button{min-height:36px}
}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative;overflow:hidden}
.li::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc)}
.li .nt b{white-space:normal}
.li .mv{display:grid;gap:2px}
.li .mv button{width:40px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.li .mv button:disabled{opacity:.3}
.li select{max-width:150px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);border-radius:var(--r);padding:8px;font:inherit;font-size:13px;min-height:40px}
.li .tg{width:44px;height:26px}.li .tg::after{width:22px;height:22px}.li .tg[aria-checked="true"]::after{left:20px}
.lh{font-size:12px;color:var(--mfg);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:6px}
.li.off .nt{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <nav class="rail" aria-label="Розділи Ролплею">

/* ---------------- minimap ---------------- */
function bounds() {

  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  ns.forEach((el) => { const n = node(el.dataset.id); x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + el.offsetWidth); y2 = Math.max(y2, n.y + el.offsetHeight); });

}

  const b = bounds(), v = views[board], sw = stage.clientWidth, sh = stage.clientHeight;

    g.fillRect(ox + (n.x - X1) * s, oy + (n.y - Y1) * s, Math.max(3, el.offsetWidth * s), Math.max(2, el.offsetHeight * s)); });

}

  const txt = JSON.stringify(out, null, 2);
  const s = sheet("Експорт полотна", `<p class="d-desc">Цим файлом можна поділитися. Позиції блоків і зв'язки йдуть у файл, а самі чати й тексти лишаються у ваших даних.</p><button class="btn pri" id="copy-json">${ico("copy")}Скопіювати</button><pre class="json" id="json-out">${esc(txt)}</pre>`);
  s.querySelector("#copy-json").onclick = async (e) => { try { await navigator.clipboard.writeText(txt); e.currentTarget.lastChild.textContent = "Скопійовано"; } catch { const r = document.createRange(); r.selectNodeContents(s.querySelector("#json-out")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Текст виділено: скопіюйте його вручну"); } };
}
function tour(force) {
  const key = "vc-tour-" + board; if (!force && (store.get(key) || phone())) return;
  let i = 0; const steps = BOARDS[board].tour;
  const show = () => {
    document.querySelectorAll(".tour").forEach((t) => t.remove()); if (i >= steps.length) { store.set(key, "1"); return; }
    const t = document.createElement("div"); t.className = "tour"; t.setAttribute("role", "dialog"); t.setAttribute("aria-label", "Підказки");
    t.innerHTML = `<span class="step">Крок ${i + 1} з ${steps.length}</span><b>${steps[i].t}</b><p>${steps[i].p}</p><div class="row"><button class="btn ghost" data-skip>Пропустити</button><button class="btn pri" data-next>${i === steps.length - 1 ? "Зрозуміло" : "Далі"}</button></div>`;
    document.body.appendChild(t);
    const anchor = i === 0 ? $("#left") : i === 1 ? nodesEl.querySelector(".port.out") : (board === "prompt" ? $("#preview") : $("#right"));
    const r = (anchor && anchor.offsetWidth ? anchor : stage).getBoundingClientRect();
    let x = i === 0 ? r.right + 12 : i === 1 ? r.right + 16 : r.left - 312, y = i === 2 && board === "prompt" ? r.bottom + 10 : r.top + 40;
    t.style.left = Math.max(12, Math.min(x, innerWidth - 312)) + "px"; t.style.top = Math.max(12, Math.min(y, innerHeight - 200)) + "px";
    t.querySelector("[data-next]").onclick = () => { i++; show(); }; t.querySelector("[data-skip]").onclick = () => { store.set(key, "1"); t.remove(); };
    t.querySelector("[data-next]").focus();
  };
  show();
}

/* ---------------- wiring up the chrome ---------------- */
const panels = { left: store.get("vc-left") !== "0", right: store.get("vc-right") !== "0" };
function setPanel(side, v) { panels[side] = v; store.set("vc-" + side, v ? "1" : "0"); syncTop(); setTimeout(() => { applyView(); drawWires(); }, 200); }
$("#close-left").onclick = () => setPanel("left", false); $("#open-left").onclick = () => setPanel("left", true);
$("#close-right").onclick = () => setPanel("right", false); $("#open-right").onclick = () => setPanel("right", true);
function setBoard(b) { board = b; sel = null; closeMenus(); document.querySelectorAll(".tour").forEach((t) => t.remove()); render(); requestAnimationFrame(() => { if (!fitted[board]) { fitted[board] = 1; fit(); } drawWires(); tour(); }); }
$("#b-links").onclick = () => setBoard("links"); $("#b-prompt").onclick = () => setBoard("prompt");
$("#m-edit").onclick = () => { if (phone()) { toast("Будувати граф можна лише на великому екрані. Тут усе змінюється через список."); return; } mode = "edit"; render(); };
$("#m-view").onclick = () => { mode = "view"; closeMenus(); render(); };
$("#v-graph").onclick = () => { listMode = false; render(); requestAnimationFrame(fit); };
$("#v-list").onclick = () => { listMode = true; render(); };
$("#undo").onclick = undo; $("#redo").onclick = redo; $("#tidy").onclick = tidy; $("#preview").onclick = preview; $("#export").onclick = exportJSON;
$("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; store.set("vc-theme", r.dataset.theme); drawMinimap(); };
{ const t = store.get("vc-theme"); if (t) document.documentElement.dataset.theme = t; }

document.addEventListener("click", (e) => {
  const t = e.target;
  const more = t.closest("[data-more]"); if (more) { const r = more.getBoundingClientRect(); nodeMenu(more.dataset.more, r.left, r.bottom + 4); return; }
  const tg = t.closest("[data-tg]"); if (tg && !tg.disabled) { setOn(tg.dataset.tg, tg.getAttribute("aria-checked") !== "true"); return; }
  const mv = t.closest("[data-mv]"); if (mv && !mv.disabled) { moveOrder(mv.dataset.mv, +mv.dataset.d); return; }
  const at = t.closest("[data-attach]"); if (at) { connect(at.dataset.attach, "out"); return; }
  const sh = t.closest("[data-show]"); if (sh) { if (phone() && listMode) { listMode = false; render(); } panTo(sh.dataset.show); return; }
  const fx = t.closest("[data-fix]"); if (fx) { $("#problems")._ps[+fx.dataset.fix].fix.run(); return; }
  const pc = t.closest("[data-add-chat]"); if (pc && !pc._dragged) { const w = toWorld(stage.getBoundingClientRect().left + stage.clientWidth / 2, stage.getBoundingClientRect().top + stage.clientHeight / 2); addNode("chat", w.x - 118, w.y - 40, pc.dataset.addChat); return; }
  const pk = t.closest("[data-add-kind]"); if (pk && !pk._dragged) { const w = toWorld(stage.getBoundingClientRect().left + stage.clientWidth / 2, stage.getBoundingClientRect().top + stage.clientHeight / 2); addNode(pk.dataset.addKind, w.x - 118, w.y - 40); return; }
  if (t.closest("#tour-again")) { store.set("vc-tour-" + board, ""); tour(true); return; }
  if (t.closest("#d-del-edge")) { removeEdge(sel.id); return; }
  if (t.closest("#d-del")) { removeNode(sel.id); return; }
  if (t.closest("#d-on")) { setOn(sel.id, !node(sel.id).on); return; }
  if (t.closest("#d-connect")) { const r = t.closest("#d-connect").getBoundingClientRect(); connectMenu(sel.id, r.left - 230, r.bottom + 4); return; }
  if (t.closest("#d-open")) { toast("У справжньому застосунку тут відкриється редактор цієї частини"); return; }
  if (t.closest("#d-info")) { const k = kindOf(node(sel.id)); const r = t.closest("#d-info").getBoundingClientRect(); closeMenus();
    const p = document.createElement("div"); p.className = "pop"; p.setAttribute("role", "dialog"); p.innerHTML = `<p><b>${k.label}</b></p><p>${k.info || "Чат з Бібліотеки. Зв'язок показує, що цей чат продовжує історію іншого, тож Бібліотека переносить у нього факти й переказ."}</p>`;
    document.body.appendChild(p); p.style.left = Math.max(8, Math.min(r.left - 250, innerWidth - 290)) + "px"; p.style.top = r.bottom + 6 + "px"; return; }
  if (!t.closest(".menu,.pop")) closeMenus();
});
document.addEventListener("change", (e) => {
  const s = e.target.closest("[data-pred]"); if (!s) return; const id = s.dataset.pred;
  B().edges = B().edges.filter((x) => x.to !== id); if (s.value) B().edges.push({ id: "e" + uid++, from: s.value, to: id }); commit(); toast(s.value ? "Зв'язок збережено" : "Тепер це початок історії", true);
});
document.addEventListener("input", (e) => { if (e.target.id === "pal-q") renderPalette(); });

/* palette drag onto canvas */
document.addEventListener("pointerdown", (e) => {
  const p = e.target.closest(".pal"); if (!p || mode !== "edit") return;
  const ghost = p.cloneNode(true); ghost.style.cssText = "position:fixed;pointer-events:none;opacity:.85;width:230px;z-index:99;box-shadow:var(--shadow)"; let started = false;
  const sx = e.clientX, sy = e.clientY; p._dragged = false;
  const mv = (ev) => { if (!started && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 5) { started = true; p._dragged = true; document.body.appendChild(ghost); }
    if (started) { ghost.style.left = ev.clientX - 20 + "px"; ghost.style.top = ev.clientY - 20 + "px"; } };
  const up = (ev) => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); ghost.remove();
    if (started) { const r = stage.getBoundingClientRect(); if (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) { const w = toWorld(ev.clientX, ev.clientY); p.dataset.addChat ? addNode("chat", w.x - 40, w.y - 20, p.dataset.addChat) : addNode(p.dataset.addKind, w.x - 40, w.y - 20); } }
    setTimeout(() => (p._dragged = false), 0); };
  addEventListener("pointermove", mv); addEventListener("pointerup", up);
});

document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === "Escape") { closeMenus(); document.querySelectorAll(".scrim,.tour").forEach((x) => x.remove()); if (drag && drag.type === "wire") { drag = null; clearTargets(); drawWires(); setCoach(null); hideReason(); } return; }
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (e.key === "[") { setPanel("left", !panels.left); return; } if (e.key === "]") { setPanel("right", !panels.right); return; }
  if (mode !== "edit" || !sel) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); sel.type === "node" ? removeNode(sel.id) : removeEdge(sel.id); return; }
  if (sel.type === "node" && e.key.startsWith("Arrow")) { e.preventDefault(); const n = node(sel.id), s = e.shiftKey ? 40 : 10; if (e.key === "ArrowLeft") n.x -= s; if (e.key === "ArrowRight") n.x += s; if (e.key === "ArrowUp") n.y -= s; if (e.key === "ArrowDown") n.y += s; commit(); nodesEl.querySelector(`.node[data-id="${n.id}"]`)?.focus(); }
});
nodesEl.addEventListener("focusin", (e) => { const nd = e.target.closest(".node"); if (nd && e.target === nd && (!sel || sel.id !== nd.dataset.id)) { sel = { type: "node", id: nd.dataset.id }; renderDetails(); nodesEl.querySelectorAll(".node.sel").forEach((x) => x.classList.remove("sel")); nd.classList.add("sel"); } });
addEventListener("resize", () => { if (phone() && mode === "edit") mode = "view"; render(); });

/* ---------------- boot ---------------- */
if (phone()) mode = "view";
render();
requestAnimationFrame(() => { fitted[board] = 1; fit(); drawWires(); drawMinimap(); tour(); });
})();
</script>
