<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Бібліотека: варіанти</title>
<style>body{margin:0;background:#07080b;color:#f0e9dc;font:13px system-ui,sans-serif}nav{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #2a2f3d;flex-wrap:wrap}button{background:#12141c;color:#f0e9dc;border:1px solid #2a2f3d;border-radius:8px;padding:7px 12px;cursor:pointer}button.on{background:#e2213a;border-color:#e2213a}.wrap{display:flex;justify-content:center}iframe{border:0;width:100%;height:calc(100vh - 52px);background:#0b0c11}.phone iframe{width:390px;border-left:1px solid #2a2f3d;border-right:1px solid #2a2f3d}</style></head>
<body><nav><b style="margin-right:8px">Бібліотека</b><button data-v="A" class="on">A · Хроніка</button><button data-v="B">B · Кодекс</button><button data-v="C">C · Реєстр</button><button data-v="D">D · Нитки</button><span style="flex:1"></span><button id="ph">Телефон 390</button></nav>
<div class="wrap" id="w"><iframe id="f" src="A.html"></iframe></div>
<script>const f=document.getElementById('f'),w=document.getElementById('w');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.src=b.dataset.v+'.html'});document.getElementById('ph').onclick=e=>{w.classList.toggle('phone');e.target.classList.toggle('on')}</script></body></html>
